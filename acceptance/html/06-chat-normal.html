<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #e9edf2; font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif; color: #16181b; }
  .wrap { padding: 24px; }
  .app { width: 672px; background: #f7f8fa; border-radius: 18px; overflow: hidden; border: 1px solid #d8dde5; }
  .head { background: #ffffff; padding: 18px 24px; border-bottom: 1px solid #e3e7ed; }
  .head h1 { margin: 0; font-size: 20px; font-weight: 600; letter-spacing: .2px; }
  .head p { margin: 5px 0 0; font-size: 12px; color: #8a909a; }
  .chat { padding: 18px 22px 24px; }
  .row { display: flex; gap: 12px; margin-bottom: 18px; }
  .avatar { width: 36px; height: 36px; border-radius: 10px; background: #dfe6ef; color: #415064; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 600; flex: none; }
  .avatar.b { background: #dcefe6; color: #2c6a50; }
  .avatar.c { background: #f3e5d8; color: #85552e; }
  .meta { display: flex; align-items: baseline; gap: 8px; margin-bottom: 5px; }
  .name { font-size: 13px; font-weight: 600; color: #3b414a; }
  .time { font-size: 11px; color: #9aa1ab; font-variant-numeric: tabular-nums; }
  .bubble { background: #ffffff; border: 1px solid #e3e7ed; border-radius: 4px 14px 14px 14px; padding: 12px 16px; font-size: 18px; line-height: 1.65; max-width: 540px; letter-spacing: .2px; }
  .foot { padding: 12px 24px; background: #ffffff; border-top: 1px solid #e3e7ed; font-size: 11px; color: #a0a6af; }
</style>
</head>
<body>
<div class="wrap">
  <div class="app">
    <div class="head"><h1>设计协作群</h1><p>3 位成员 · 工作沟通</p></div>
    <div class="chat">
      <div class="row">
        <div class="avatar">王</div>
        <div>
          <div class="meta"><span class="name">王可</span><span class="time">10/20 09:10</span></div>
          <div class="bubble">新版活动页由小雨负责，10月24日前交设计稿。</div>
        </div>
      </div>
      <div class="row">
        <div class="avatar b">雨</div>
        <div>
          <div class="meta"><span class="name">小雨</span><span class="time">10/20 09:12</span></div>
          <div class="bubble">收到，10月24日前给。</div>
        </div>
      </div>
      <div class="row">
        <div class="avatar">王</div>
        <div>
          <div class="meta"><span class="name">王可</span><span class="time">10/20 09:15</span></div>
          <div class="bubble">前端联调我这边来，10月25日前进测试。</div>
        </div>
      </div>
    </div>
    <div class="foot">聊天记录 · 仅用于 FlowBack 验收合成数据</div>
  </div>
</div>
</body>
</html>
